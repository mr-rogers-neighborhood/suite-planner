appId: run.suite.planner
productName: Suite Planner
# The binary name is part of what the hub records, so it has to be a name a person would
# recognise rather than whatever the product name becomes.
executableName: suite-planner
copyright: Copyright © Suite contributors

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

asar: true

# The switches an attacker cannot turn back on after packaging.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Every page is served from a custom protocol now, so file:// needs no extra privileges.
  grantFileProtocolExtraPrivileges: false

extraResources:
  - from: resources
    to: .
# The hub discovers an app by the manifest beside its executable, so this lands next to the
# binary rather than in resources.
extraFiles:
  - from: suite.app.json
    to: suite.app.json

linux:
  target:
    - AppImage
    - deb
  category: Office

mac:
  target:
    - dmg
  category: public.app-category.productivity

win:
  target:
    - nsis

fileAssociations:
  - ext: planner
    name: Suite Planner Workspace
    description: A Suite Planner workspace
    role: Editor
    mimeType: application/x-suite-planner
