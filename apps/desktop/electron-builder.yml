appId: run.suite.planner
productName: Suite Planner
copyright: Copyright © Suite contributors

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

extraResources:
  - from: resources
    to: .

linux:
  target:
    - AppImage
    - deb
  category: Office

mac:
  target:
    - dmg
  category: public.app-category.productivity

win:
  target:
    - nsis
