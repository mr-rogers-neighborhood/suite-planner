name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  # No app is launched here; skipping the Electron download keeps the job fast.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The whole suite, not `--changed`: a fresh clone has no base to diff against.
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Shape
        run: pnpm shape
      - name: No unused files or dependencies
        run: pnpm knip
      - name: Build
        run: pnpm build
